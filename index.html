<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff4f8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>おみせポケット</title>
  <style>
    :root{--pink:#ff4f8b;--ink:#28252c;--muted:#77727e;--bg:#fff6fa;--line:#f1dce6}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 88% 5%,#d9f8f2 0 13%,transparent 14%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{position:sticky;top:0;z-index:2;padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;background:#fff6faef;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.head{display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:25px;letter-spacing:-.04em}.sub{margin:3px 0 0;color:var(--muted);font-size:12px}.coins{padding:8px 11px;border-radius:999px;background:#fff0bd;color:#b36f00;font-size:13px;font-weight:800}main{padding:18px 14px 118px;max-width:720px;margin:auto}.hint{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:18px;font-size:13px;line-height:1.45}.hint img{width:42px;height:42px;object-fit:contain}#spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.spot{min-height:154px;padding:12px;border:0;border-radius:20px;color:var(--ink);text-align:left;background:#fff;box-shadow:0 4px 16px #c26e9420;cursor:pointer;position:relative}.spot:active,.action:active{transform:scale(.97)}.spot img{width:58px;height:58px;object-fit:contain;border-radius:16px;background:#ecfff8}.spot strong{display:block;margin-top:8px;font-size:15px;overflow-wrap:anywhere}.spot small{display:block;margin-top:4px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edit{position:absolute;top:9px;right:9px;border:0;background:#f7edf2;border-radius:50%;width:29px;height:29px;cursor:pointer}.empty{grid-column:1/-1;padding:44px 16px;text-align:center;background:#fff;border:1px dashed #eeb6cd;border-radius:24px}.empty img{width:92px}.empty p{color:var(--muted);font-size:14px;line-height:1.6}.bottom{position:fixed;inset:auto 0 0;z-index:2;padding:12px 20px calc(env(safe-area-inset-bottom) + 13px);text-align:center;background:#fff6faef;border-top:1px solid var(--line);backdrop-filter:blur(16px)}.actions{display:flex;justify-content:center;gap:10px}.action{border:0;border-radius:16px;padding:10px 14px;color:var(--ink);background:#fff;font:700 13px inherit;box-shadow:0 3px 12px #c26e9420;cursor:pointer}.action.camera{color:#fff;background:var(--pink);box-shadow:0 5px 14px #ff4f8b66}dialog{width:min(100%,520px);margin:auto 0 0;border:0;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -8px 30px #0003}dialog::backdrop{background:#25131c66}dialog h2{margin:0 0 10px;font-size:19px}input{width:100%;border:0;border-radius:13px;padding:14px;background:#f6eff3;font:inherit;margin:8px 0}.url{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.primary,.secondary{width:100%;border:0;padding:14px;border-radius:13px;font:inherit;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:var(--pink);color:#fff}.secondary{background:#f6eff3;color:var(--ink)}
    .rewards{margin-top:16px}.rewards.locked{display:none}.reward-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px}.reward-head h2{margin:0;font-size:16px}.reward-head span{font-size:12px;color:var(--muted)}.exchange{border:0;border-radius:999px;padding:8px 12px;background:#fff0bd;color:#9a6100;font:800 12px inherit;cursor:pointer}.exchange:disabled{background:#eee;color:#999}.ticket{position:relative;overflow:hidden;margin:10px 0;padding:15px 16px;background:linear-gradient(105deg,#fff3c6,#fffdf4);border:2px dashed #f3c965;border-radius:18px;box-shadow:0 3px 12px #c26e9420}.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}.ticket:before{left:-12px}.ticket:after{right:-12px}.ticket.used{filter:grayscale(1);opacity:.68;background:#e5e5e5;border-color:#a4a4a4}.ticket-top{display:flex;justify-content:space-between;align-items:center;font-weight:900}.ticket-sub{margin:4px 0 11px;color:#806720;font-size:12px}.ticket.used .ticket-sub{color:#666}.used-label{padding:5px 8px;border-radius:999px;background:#666;color:#fff;font-size:11px}.swipe-wrap{display:flex;align-items:center;gap:8px;background:#fff9e5;border-radius:999px;padding:6px 9px}.ticket.used .swipe-wrap{background:#d5d5d5}.swipe-note{font-size:11px;font-weight:700;white-space:nowrap}.swipe{width:100%;accent-color:var(--pink)}.ticket-empty{padding:13px 15px;border:1px dashed #e6cfe0;border-radius:16px;background:#fff;color:var(--muted);font-size:13px}.scanner{width:100%;max-width:520px;margin:auto 0 0;padding:18px;border-radius:24px 24px 0 0;background:#201d23;color:#fff}.scanner h2{margin:0 0 8px;font-size:18px}.scanner p{margin:0 0 14px;color:#ddd;font-size:13px}.scanner video{display:block;width:100%;max-height:62vh;object-fit:cover;border-radius:16px;background:#000}.scanner button{width:100%;margin-top:12px;border:0;border-radius:13px;padding:13px;background:#fff;color:#28252c;font:800 15px inherit;cursor:pointer}
  </style>
</head>
<body>
  <header><div class="head"><div><h1>おみせポケット</h1><p class="sub">QRコードから、お気に入りのおみせを集めよう</p></div><button class="coins" id="coin-badge" aria-label="ごほうびと交換">⭐ <span id="coins">0</span></button></div></header>
  <main><div class="hint"><img src="icons/icon-192.png" alt="オリジナルのマスコット"><span>カードをタップするとおみせを開けるよ。長押しで削除、鉛筆ボタンでQRを更新できます。</span></div><section class="rewards locked" id="reward-area" aria-label="特典"><div class="reward-head"><h2>🎁 とくてん</h2><span>150コインでごほうび</span></div><div id="tickets"></div></section><section id="spots" aria-live="polite"></section></main>
  <div class="bottom"><div class="actions"><button class="action" id="url-add">URL入力</button><button class="action" id="add">写真から選ぶ</button><button class="action camera" id="camera-add">カメラで撮影</button></div></div>
  <input id="file" type="file" accept="image/*" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden><canvas id="canvas" hidden></canvas>
  <dialog id="dialog"><h2>おみせの名前をつけよう</h2><div class="url" id="url"></div><input id="name" maxlength="24" placeholder="例：ケーキやさん"><button class="primary" id="save">保存する</button><button class="secondary" id="cancel">キャンセル</button></dialog><dialog id="url-dialog"><h2>URLを入力</h2><input id="manual-url" type="url" inputmode="url" placeholder="https://..."><button class="primary" id="save-url">つぎへ</button><button class="secondary" id="cancel-url">キャンセル</button></dialog><dialog id="reward-dialog"><h2>ごほうびと交換</h2><p class="url">たまったコインでチケットに交換しよう。</p><div id="reward-list"></div><button class="secondary" id="close-rewards">とじる</button></dialog><dialog id="unlock-dialog"><h2>🎁 とくてんが解放されたよ！</h2><p class="url">30コインたまったので、「ごほうび」と交換できるようになりました。</p><button class="primary" id="unlock-continue">つづける</button></dialog><dialog class="scanner" id="scanner"><h2>QRコードをかざしてね</h2><p>カメラへのアクセスを許可してください。</p><video id="camera-video" playsinline muted></video><button id="close-camera">やめる</button></dialog>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script>
    const spotKey='omise-pocket-spots',coinKey='omise-pocket-coins',ticketKey='omise-pocket-tickets',coinHistoryKey='omise-pocket-coin-history';let pending='',editing=-1,cameraStream=null,scanning=false;
    const $=s=>document.querySelector(s),get=()=>JSON.parse(localStorage.getItem(spotKey)||'[]'),put=v=>localStorage.setItem(spotKey,JSON.stringify(v)),getCoins=()=>Number(localStorage.getItem(coinKey)||0),setCoins=n=>localStorage.setItem(coinKey,String(n)),getTickets=()=>JSON.parse(localStorage.getItem(ticketKey)||'[]'),putTickets=v=>localStorage.setItem(ticketKey,JSON.stringify(v));
    const today=()=>new Date().toLocaleDateString('sv-SE'),rewardUnlocked=()=>localStorage.getItem('omise-pocket-rewards-unlocked')==='yes';
    function awardCoin(url){let history=JSON.parse(localStorage.getItem(coinHistoryKey)||'{"day":"","urls":[]}');if(history.day!==today())history={day:today(),urls:[]};if(history.urls.includes(url))return {earned:false,unlockedNow:false};history.urls.push(url);localStorage.setItem(coinHistoryKey,JSON.stringify(history));const coins=getCoins()+1;setCoins(coins);const unlockedNow=coins>=30&&!rewardUnlocked();if(unlockedNow)localStorage.setItem('omise-pocket-rewards-unlocked','yes');return {earned:true,unlockedNow}}
    const host=u=>{try{return new URL(u).host}catch{return u}};
    function renderTickets(){const coins=getCoins(),tickets=getTickets(),box=$('#tickets');let html=`<div class="reward-head"><button class="exchange" id="exchange" ${coins<150?'disabled':''}>150コインで交換</button></div>`;if(!tickets.length)html+='<div class="ticket-empty">コインを150ためると、ガチャガチャ1回無料券に交換できるよ。</div>';tickets.slice().reverse().forEach(t=>{const used=t.status==='used';html+=`<article class="ticket ${used?'used':''}"><div class="ticket-top"><span>🎟 ガチャガチャ 1回無料券</span>${used?'<span class="used-label">使用済み</span>':'<span>FREE</span>'}</div><div class="ticket-sub">好きなガチャガチャを1回無料でまわせます</div><div class="swipe-wrap"><span class="swipe-note">${used?'このチケットは使用済み':'右へスワイプして使用'}</span><input class="swipe" type="range" min="0" max="100" value="0" ${used?'disabled':''} data-id="${t.id}" aria-label="チケットを使用済みにする"></div></article>`});box.innerHTML=html;$('#exchange').onclick=()=>{if(getCoins()<150)return;const list=getTickets();list.push({id:Date.now(),status:'available'});putTickets(list);setCoins(getCoins()-150);render()};box.querySelectorAll('.swipe').forEach(slider=>slider.onchange=e=>{if(Number(e.target.value)>=90){const list=getTickets();const ticket=list.find(t=>String(t.id)===e.target.dataset.id);if(ticket){ticket.status='used';putTickets(list);render()}}else e.target.value=0})}
    function render(){const spots=get(),box=$('#spots'),unlocked=rewardUnlocked();$('#coins').textContent=getCoins();$('#reward-area').classList.toggle('locked',!unlocked);if(unlocked)renderTickets();if(!spots.length){box.innerHTML='<div class="empty"><img src="icons/icon-512.png" alt=""><h2>まだおみせがないよ</h2><p>下のボタンからQRコードを読み取って<br>お気に入りを登録しよう！</p></div>';return}box.innerHTML='';spots.forEach((s,i)=>{const el=document.createElement('article');el.className='spot';el.innerHTML='<button class="edit" aria-label="更新">✎</button><img src="icons/icon-192.png" alt=""><strong></strong><small></small>';el.querySelector('strong').textContent=s.name;el.querySelector('small').textContent=host(s.url);let timer;el.onpointerdown=e=>{if(e.target.closest('.edit'))return;timer=setTimeout(()=>{if(confirm('「'+s.name+'」を削除しますか？')){const a=get();a.splice(i,1);put(a);render()}},650)};['pointerup','pointerleave','pointercancel'].forEach(n=>el.addEventListener(n,()=>clearTimeout(timer)));el.onclick=e=>{if(e.target.closest('.edit'))return;const outcome=awardCoin(s.url);if(outcome.earned)render();if(outcome.unlockedNow){window.unlockTarget=s.url;$('#unlock-dialog').showModal();return}location.href=s.url};el.querySelector('.edit').onclick=e=>{e.stopPropagation();editing=i;$('#file').click()};box.append(el)})}
    function handleUrl(url){pending=url;if(editing>=0){const a=get();a[editing].url=pending;put(a);editing=-1;render();return}$('#url').textContent=pending;$('#dialog').showModal();$('#name').focus()}
    async function scan(file){if(!file)return;const isHeic=/\.(heic|heif)$/i.test(file.name)||/image\/(heic|heif)/i.test(file.type);if(isHeic&&window.heic2any){const converted=await heic2any({blob:file,toType:'image/jpeg',quality:.9});file=new File([Array.isArray(converted)?converted[0]:converted],'qr-photo.jpg',{type:'image/jpeg'})}const image=await createImageBitmap(file,{imageOrientation:'from-image'}),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),scale=Math.min(1,1600/Math.max(image.width,image.height));canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);ctx.drawImage(image,0,0,canvas.width,canvas.height);image.close();const code=jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(!code||!/^https?:\/\//i.test(code.data)){alert('URLのQRコードが見つかりませんでした。');return}handleUrl(code.data)}
    async function startCamera(){const modal=$('#scanner'),video=$('#camera-video');try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=cameraStream;modal.showModal();await video.play();scanning=true;scanCamera()}catch(err){alert('カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。');stopCamera()}}
    function stopCamera(){scanning=false;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}const modal=$('#scanner');if(modal.open)modal.close()}
    function scanCamera(){if(!scanning)return;const video=$('#camera-video'),canvas=$('#canvas');if(video.readyState>=2){const ctx=canvas.getContext('2d',{willReadFrequently:true});canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);const code=jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(code&&/^https?:\/\//i.test(code.data)){stopCamera();handleUrl(code.data);return}}requestAnimationFrame(scanCamera)}
    const choose=e=>{scan(e.target.files[0]).catch(()=>alert('画像を読み込めませんでした。'));e.target.value=''};
    $('#url-add').onclick=()=>{editing=-1;$('#url-dialog').showModal();$('#manual-url').focus()};$('#save-url').onclick=()=>{const url=$('#manual-url').value.trim();if(!/^https?:\/\//i.test(url)){alert('https:// から始まるURLを入力してください。');return}$('#manual-url').value='';$('#url-dialog').close();handleUrl(url)};$('#cancel-url').onclick=()=>$('#url-dialog').close();$('#add').onclick=()=>{editing=-1;$('#file').click()};$('#camera-add').onclick=()=>{editing=-1;startCamera()};$('#file').onchange=choose;$('#camera').onchange=choose;$('#close-camera').onclick=stopCamera;$('#scanner').addEventListener('close',()=>{if(cameraStream)stopCamera()});
    $('#save').onclick=()=>{const name=$('#name').value.trim();if(!name)return $('#name').focus();const spots=get();spots.push({name,url:pending});put(spots);$('#name').value='';$('#dialog').close();render()};$('#cancel').onclick=()=>$('#dialog').close();
    const rewardKey='omise-pocket-rewards',defaultRewards=[{id:'reward',name:'ごほうび',cost:150,ticketName:'ガチャガチャ 1回プレゼントチケット'}];
    const safe=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function getRewards(){return defaultRewards}
    function nextTicketSerial(){const next=Number(localStorage.getItem('omise-pocket-ticket-serial')||0)+1;localStorage.setItem('omise-pocket-ticket-serial',String(next));return 'G-'+String(next).padStart(5,'0')}
    function issueTicket(name){const list=getTickets();list.push({id:Date.now(),serial:nextTicketSerial(),name,status:'available',date:today()});putTickets(list)}
    function redeemReward(id){const reward=getRewards().find(r=>r.id===id);if(!reward||getCoins()<reward.cost)return;setCoins(getCoins()-reward.cost);issueTicket(reward.ticketName);render();$('#reward-dialog').close()}
    function renderRewardCatalog(){const coins=getCoins(),box=$('#reward-list');box.innerHTML=getRewards().map(r=>`<div class="swipe-wrap" style="margin:8px 0"><span class="swipe-note" style="flex:1">${safe(r.name)}<br><small>⭐ ${r.cost}</small></span><button class="exchange redeem-reward" data-id="${r.id}" ${coins<r.cost?'disabled':''}>交換</button></div>`).join('');box.querySelectorAll('.redeem-reward').forEach(b=>b.onclick=()=>redeemReward(b.dataset.id))}
    function renderTickets(){const coins=getCoins(),tickets=getTickets(),box=$('#tickets');let html=`<div class="reward-head"><button class="exchange" id="exchange" ${coins<150?'disabled':''}>ごほうびを交換（150コイン）</button></div>`;if(!tickets.length)html+='<div class="ticket-empty">ごほうびと交換すると、チケットがここに届くよ。</div>';tickets.slice().reverse().forEach(t=>{const used=t.status==='used'||t.used;const name=safe(t.name||'ガチャガチャ 1回プレゼントチケット');const serial=safe(t.serial||('G-'+String(t.id||0).slice(-5)));html+=`<article class="ticket ${used?'used':''}"><div class="ticket-top"><span>🎟 ${name}</span>${used?'<span class="used-label">使用済み</span>':'<span>GIFT</span>'}</div><div class="ticket-sub">とくてん：ごほうび　／　シリアル No.${serial}</div><div class="swipe-wrap"><span class="swipe-note">${used?'このチケットは使用済み':'右へスワイプして使用'}</span><input class="swipe" type="range" min="0" max="100" value="0" ${used?'disabled':''} data-id="${t.id||t.serial}" aria-label="チケットを使用済みにする"></div></article>`});box.innerHTML=html;$('#exchange').onclick=()=>redeemReward('reward');box.querySelectorAll('.swipe').forEach(slider=>slider.onchange=e=>{if(Number(e.target.value)>=90){const list=getTickets(),ticket=list.find(t=>String(t.id||t.serial)===e.target.dataset.id);if(ticket){ticket.status='used';ticket.used=true;putTickets(list);render()}}else e.target.value=0})}
    $('#coin-badge').onclick=()=>{if(!rewardUnlocked())return;renderRewardCatalog();$('#reward-dialog').showModal()};$('#close-rewards').onclick=()=>$('#reward-dialog').close();$('#unlock-continue').onclick=()=>{const url=window.unlockTarget;$('#unlock-dialog').close();if(url)location.href=url};
    if(getCoins()>=30&&!rewardUnlocked()){localStorage.setItem('omise-pocket-rewards-unlocked','yes');setTimeout(()=>$('#unlock-dialog').showModal(),0)}
    if('serviceWorker'in navigator){let refreshed=false;navigator.serviceWorker.register('./sw.js').then(reg=>{reg.update();reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)worker.postMessage({type:'SKIP_WAITING'})})})});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshed){refreshed=true;location.reload()}})}render();
  </script>
</body>
</html>
