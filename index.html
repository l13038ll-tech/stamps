<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff4f8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>おみせポケット</title>
  <style>
    :root{--pink:#ff4f8b;--ink:#28252c;--muted:#77727e;--bg:#fff6fa;--line:#f1dce6}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 88% 5%,#d9f8f2 0 13%,transparent 14%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{position:sticky;top:0;z-index:2;padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;background:#fff6faef;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.head{display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:25px;letter-spacing:-.04em}.sub{margin:3px 0 0;color:var(--muted);font-size:12px}.coins{padding:8px 11px;border-radius:999px;background:#fff0bd;color:#b36f00;font-size:13px;font-weight:800}main{padding:18px 14px 118px;max-width:720px;margin:auto}.hint{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:18px;font-size:13px;line-height:1.45}.hint img{width:42px;height:42px;object-fit:contain}#spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.spot{min-height:154px;padding:12px;border:0;border-radius:20px;color:var(--ink);text-align:left;background:#fff;box-shadow:0 4px 16px #c26e9420;cursor:pointer;position:relative}.spot:active,.action:active{transform:scale(.97)}.spot img{width:58px;height:58px;object-fit:contain;border-radius:16px;background:#ecfff8}.spot strong{display:block;margin-top:8px;font-size:15px;overflow-wrap:anywhere}.spot small{display:block;margin-top:4px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edit{position:absolute;top:9px;right:9px;border:0;background:#f7edf2;border-radius:50%;width:29px;height:29px;cursor:pointer}.empty{grid-column:1/-1;padding:44px 16px;text-align:center;background:#fff;border:1px dashed #eeb6cd;border-radius:24px}.empty img{width:92px}.empty p{color:var(--muted);font-size:14px;line-height:1.6}.bottom{position:fixed;inset:auto 0 0;z-index:2;padding:12px 20px calc(env(safe-area-inset-bottom) + 13px);text-align:center;background:#fff6faef;border-top:1px solid var(--line);backdrop-filter:blur(16px)}.actions{display:flex;justify-content:center;gap:10px}.action{border:0;border-radius:16px;padding:10px 14px;color:var(--ink);background:#fff;font:700 13px inherit;box-shadow:0 3px 12px #c26e9420;cursor:pointer}.action.camera{color:#fff;background:var(--pink);box-shadow:0 5px 14px #ff4f8b66}dialog{width:min(100%,520px);margin:auto 0 0;border:0;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -8px 30px #0003}dialog::backdrop{background:#25131c66}dialog h2{margin:0 0 10px;font-size:19px}input{width:100%;border:0;border-radius:13px;padding:14px;background:#f6eff3;font:inherit;margin:8px 0}.url{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.primary,.secondary{width:100%;border:0;padding:14px;border-radius:13px;font:inherit;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:var(--pink);color:#fff}.secondary{background:#f6eff3;color:var(--ink)}
  </style>
</head>
<body>
  <header><div class="head"><div><h1>おみせポケット</h1><p class="sub">QRコードから、お気に入りのおみせを集めよう</p></div><div class="coins">⭐ <span id="coins">0</span></div></div></header>
  <main><div class="hint"><img src="icons/icon-192.png" alt="オリジナルのマスコット"><span>カードをタップするとおみせを開けるよ。長押しで削除、鉛筆ボタンでQRを更新できます。</span></div><section id="spots" aria-live="polite"></section></main>
  <div class="bottom"><div class="actions"><button class="action" id="add">写真から選ぶ</button><button class="action camera" id="camera-add">📷 カメラで撮影</button></div></div>
  <input id="file" type="file" accept="image/*" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden><canvas id="canvas" hidden></canvas>
  <dialog id="dialog"><h2>おみせの名前をつけよう</h2><div class="url" id="url"></div><input id="name" maxlength="24" placeholder="例：ケーキやさん"><button class="primary" id="save">保存する</button><button class="secondary" id="cancel">キャンセル</button></dialog>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const spotKey='omise-pocket-spots',coinKey='omise-pocket-coins';let pending='',editing=-1;
    const $=s=>document.querySelector(s),get=()=>JSON.parse(localStorage.getItem(spotKey)||'[]'),put=v=>localStorage.setItem(spotKey,JSON.stringify(v));
    const host=u=>{try{return new URL(u).host}catch{return u}};
    function render(){const spots=get(),box=$('#spots');$('#coins').textContent=localStorage.getItem(coinKey)||0;if(!spots.length){box.innerHTML='<div class="empty"><img src="icons/icon-512.png" alt=""><h2>まだおみせがないよ</h2><p>下のボタンからQRコードを読み取って<br>お気に入りを登録しよう！</p></div>';return}box.innerHTML='';spots.forEach((s,i)=>{const el=document.createElement('article');el.className='spot';el.innerHTML='<button class="edit" aria-label="更新">✎</button><img src="icons/icon-192.png" alt=""><strong></strong><small></small>';el.querySelector('strong').textContent=s.name;el.querySelector('small').textContent=host(s.url);let timer;el.onpointerdown=e=>{if(e.target.closest('.edit'))return;timer=setTimeout(()=>{if(confirm('「'+s.name+'」を削除しますか？')){const a=get();a.splice(i,1);put(a);render()}},650)};['pointerup','pointerleave','pointercancel'].forEach(n=>el.addEventListener(n,()=>clearTimeout(timer)));el.onclick=e=>{if(e.target.closest('.edit'))return;localStorage.setItem(coinKey,Number(localStorage.getItem(coinKey)||0)+1);render();location.href=s.url};el.querySelector('.edit').onclick=e=>{e.stopPropagation();editing=i;$('#file').click()};box.append(el)})}
    async function scan(file){if(!file)return;const image=await createImageBitmap(file,{imageOrientation:'from-image'}),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),scale=Math.min(1,1600/Math.max(image.width,image.height));canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);ctx.drawImage(image,0,0,canvas.width,canvas.height);image.close();const code=jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(!code||!/^https?:\/\//i.test(code.data)){alert('URLのQRコードが見つかりませんでした。');return}pending=code.data;if(editing>=0){const a=get();a[editing].url=pending;put(a);editing=-1;render();return}$('#url').textContent=pending;$('#dialog').showModal();$('#name').focus()}
    const choose=e=>{scan(e.target.files[0]).catch(()=>alert('画像を読み込めませんでした。'));e.target.value=''};
    $('#add').onclick=()=>{editing=-1;$('#file').click()};$('#camera-add').onclick=()=>{editing=-1;$('#camera').click()};$('#file').onchange=choose;$('#camera').onchange=choose;
    $('#save').onclick=()=>{const name=$('#name').value.trim();if(!name)return $('#name').focus();const spots=get();spots.push({name,url:pending});put(spots);$('#name').value='';$('#dialog').close();render()};$('#cancel').onclick=()=>$('#dialog').close();
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
  </script>
</body>
</html>
